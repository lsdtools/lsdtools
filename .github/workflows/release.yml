# Generated by lsd-product lsdtools/wheel/public; edit there, never here (tools/check_provenance.py).
#
# A v* tag releases what lsd-product's local gate tested, nothing else:
#   provenance  every file is lsd-product's export (PROVENANCE.json)
#   build       the wheel and sdist this tree builds have the sha256 release/<version>.json names
#   reproduce   Windows and macOS build the same bytes
#   test        the artifact itself, installed, on three systems and Python 3.10 to 3.14
#   testpypi    published by trusted publishing, after a person approves the testpypi environment
#   pypi        the same files, after a person approves the pypi environment; then the index serves
#               exactly those sha256 and attests this workflow published them
#   release     the GitHub release carries the files and their release record
# Every action is pinned to a commit. Only the two publishing jobs may request an OIDC token.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: provenance
        run: python tools/check_provenance.py
      - name: build
        run: python tools/build.py dist
      - name: the tested release
        run: python tools/check_release.py dist "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  reproduce:
    needs: build
    strategy:
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: the same bytes here
        shell: bash
        run: |
          python tools/build.py dist
          python tools/check_release.py dist "$GITHUB_REF_NAME"

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: install the artifact
        shell: bash
        run: python -m pip install --disable-pip-version-check dist/*.whl
      - name: test it
        run: python -m unittest discover -s tests -v

  testpypi:
    needs: [reproduce, test]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lsdtools
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-served:
    needs: testpypi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: TestPyPI serves the release
        run: python tools/check_index.py https://test.pypi.org "${GITHUB_REF_NAME#v}"

  pypi:
    needs: testpypi-served
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/lsdtools
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  pypi-served:
    needs: pypi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: PyPI serves the release
        run: python tools/check_index.py https://pypi.org "${GITHUB_REF_NAME#v}"

  github-release:
    needs: pypi-served
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* "release/$version.json" --repo "$GITHUB_REPOSITORY" \
            --title "lsdtools $version" --notes "pip install lsdtools==$version" $prerelease
